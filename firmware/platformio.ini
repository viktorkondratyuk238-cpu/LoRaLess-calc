[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library
    olikraus/U8g2

; One build per board. Flash each board with its own environment, e.g.
;   pio run -e calc1 -t upload
[env:calc1]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DDEVICE_ID=1
[env:calc2]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DDEVICE_ID=2
[env:calc3]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DDEVICE_ID=3
[env:calc4]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DDEVICE_ID=4
